<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>New Test Page</title>

<style>
  body {
    max-width: 820px;
    margin: 0 auto;
    background: #f8fafc;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
    overflow-x: hidden;
  }

  /* Slide container */
  #slide {
    position: relative;
    padding: 32px 20px 100px 20px;
    animation-duration: 0.35s;
    animation-timing-function: ease-out;
  }
  .slide-in-right { animation-name: slideInRight; }
  .slide-in-left  { animation-name: slideInLeft; }

  @keyframes slideInRight {
    0% { opacity: 0; transform: translateX(40px); }
    100%{ opacity:1; transform: translateX(0); }
  }
  @keyframes slideInLeft {
    0% { opacity: 0; transform: translateX(-40px); }
    100%{ opacity:1; transform: translateX(0); }
  }

  .card {
    background: white;
    padding: 20px;
    border-radius: 14px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.06);
  }

  nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: #ffffff;
    border-top: 1px solid #e5e7eb;
    display: flex;
    justify-content: space-around;
    padding: 10px 0;
    font-size: 15px;
  }
  nav a {
    text-decoration: none;
    color: #0f172a;
    font-weight: 600;
  }
  nav a.active { color: #1d4ed8; }
</style>
</head>

<body>

<div id="slide" class="slide-in-left">
  <div class="card">
    <h1>New Test Page</h1>
    <p>This is a second page inside your PWA.</p>
  </div>
</div>

<nav>
  <a href="index.html" data-direction="right">Frost</a>
  <a href="test.html" class="active" data-direction="left">New test page</a>
</nav>

<script>
document.querySelectorAll("nav a").forEach(link => {
  link.addEventListener("click", e => {
    e.preventDefault();
    const dir = link.dataset.direction;
    const slide = document.getElementById("slide");

    slide.className = dir === "left" ? "slide-in-left" : "slide-in-right";

    setTimeout(() => {
      window.location.href = link.href;
    }, 200);
  });
});
</script>

</body>
</html>
