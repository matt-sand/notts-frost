<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Rota</title>

<style>
  body {
    max-width: 820px;
    margin: 0 auto;
    background: #f8fafc;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
    overflow-x: hidden;
  }

  /* Slide container */
  #slide {
    position: relative;
    padding: 32px 20px 100px 20px;
    animation-duration: 0.35s;
    animation-timing-function: ease-out;
  }
  .slide-in-right { animation-name: slideInRight; }
  .slide-in-left  { animation-name: slideInLeft; }

  @keyframes slideInRight {
    0% { opacity: 0; transform: translateX(40px); }
    100%{ opacity:1; transform: translateX(0); }
  }
  @keyframes slideInLeft {
    0% { opacity: 0; transform: translateX(-40px); }
    100%{ opacity:1; transform: translateX(0); }
  }

  .card {
    background: white;
    padding: 20px;
    border-radius: 14px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.06);
    margin-bottom: 20px;
  }

  .status-good {
    color: #0f5132;
    background: #ecfdf5;
    padding: 8px 12px;
    border-radius: 8px;
    font-weight: 600;
    display: inline-block;
    margin-bottom: 6px;
  }
  .status-bad {
    color: #c0262e;
    background: #ffeef0;
    padding: 8px 12px;
    border-radius: 8px;
    font-weight: 600;
    display: inline-block;
    margin-bottom: 6px;
  }

  .forecast-item {
    padding: 8px 12px;
    border-radius: 8px;
    margin-bottom: 6px;
    font-size: 15px;
  }
  .work { background:#ecfdf5; color:#0f5132; }
  .off  { background:#ffeef0; color:#c0262e; }

  nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: #ffffff;
    border-top: 1px solid #e5e7eb;
    display: flex;
    justify-content: space-around;
    padding: 10px 0;
    font-size: 15px;
  }
  nav a {
    text-decoration: none;
    color: #0f172a;
    font-weight: 600;
  }
  nav a.active { color: #1d4ed8; }

  @media (prefers-color-scheme: dark) {
    body { background:#0b1220; color:#e6eef8; }
    .card { background:#071226; }
    nav { background:#0b1220; border-top-color:#1e2633; }
    nav a { color:#e6eef8; }
    nav a.active { color:#60a5fa; }
    .forecast-item.work { background:#0a2f1f; color:#8ff4c8; }
    .forecast-item.off  { background:#3f0a0a; color:#ffb4b4; }
  }
</style>
</head>

<body>

<div id="slide" class="slide-in-left">

  <div class="card">
    <h1>Rota</h1>

    <!-- TODAY / TOMORROW STATUS -->
    <div id="todayStatus"></div>
    <div id="tomorrowStatus" style="margin-top:8px;"></div>

    <hr style="margin:20px 0; border:0; border-bottom:1px solid #e5e7eb;">

    <!-- 14-DAY FORECAST -->
    <h2 style="margin-bottom:10px;">14-Day Work Forecast</h2>
    <div id="forecastList"></div>

    <h2 style="margin-top:25px; margin-bottom:10px;">Next Day Simon Works</h2>
    <div id="nextWork"></div>

    <hr style="margin:20px 0; border:0; border-bottom:1px solid #e5e7eb;">

    <p><a href="https://monzo.me/matthewsanders48/1.00?d=Pwa&h=WmeOsl">give me money thanks</a></p>
  </div>

</div>

<!-- Bottom Navigation -->
<nav>
  <a href="index.html" data-direction="right">Frost</a>
  <a href="test.html" class="active" data-direction="left">Rota</a>
</nav>

<script>
/* SLIDE TRANSITIONS */
document.querySelectorAll("nav a").forEach(link => {
  link.addEventListener("click", e => {
    e.preventDefault();
    const dir = link.dataset.direction;
    const slide = document.getElementById("slide");
    slide.className = dir === "left" ? "slide-in-left" : "slide-in-right";
    setTimeout(() => { window.location.href = link.href; }, 200);
  });
});
</script>

<script>
/* ===============================================================
   SIMON'S 35-DAY REPEATING ROTA PATTERN
   Base date: 30 Nov 2025
   =============================================================== */

const rotaBase = new Date("2025-11-30T00:00:00");

const offOffsets = new Set([
  0, 1, 2,       // 30 Nov, 1 Dec, 2 Dec
  5, 6, 7, 8, 9, // 5–9 Dec
  15, 16,        // 15–16 Dec
  20, 21, 22,    // 20–22 Dec
  27, 28,        // 27–28 Dec
  33, 34         // 2–3 Jan
]);

function isSimonOffOn(date) {
  const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  const diffMs = d - rotaBase;
  const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
  if (diffDays < 0) return false;
  return offOffsets.has(diffDays % 35);
}

function formatStatus(isOff) {
  return isOff
    ? `<div class="status-bad">Simon is OFF</div>`
    : `<div class="status-good">Simon is working</div>`;
}

function formatDate(d) {
  return d.toLocaleDateString("en-GB", {
    weekday: "short",
    day: "2-digit",
    month: "short"
  });
}

/* TODAY + TOMORROW */
const today = new Date();
const tomorrow = new Date();
tomorrow.setDate(today.getDate() + 1);

document.getElementById("todayStatus").innerHTML =
  `<strong>Today:</strong><br>` + formatStatus(isSimonOffOn(today));

document.getElementById("tomorrowStatus").innerHTML =
  `<strong>Tomorrow:</strong><br>` + formatStatus(isSimonOffOn(tomorrow));

/* 14-DAY FORECAST */
(function buildForecast(){
  const listEl = document.getElementById("forecastList");
  listEl.innerHTML = "";

  for (let i = 0; i < 14; i++) {
    const d = new Date();
    d.setDate(today.getDate() + i);

    const isOff = isSimonOffOn(d);

    const row = document.createElement("div");
    row.className = `forecast-item ${isOff ? "off" : "work"}`;
    row.textContent = `${formatDate(d)} — ${isOff ? "OFF" : "Working"}`;

    listEl.appendChild(row);
  }
})();

/* NEXT WORKING DAY */
(function findNextWorkDay(){
  const el = document.getElementById("nextWork");

  for (let i = 1; i < 60; i++) {
    const d = new Date();
    d.setDate(today.getDate() + i);

    if (!isSimonOffOn(d)) {
      el.textContent = `${formatDate(d)} — Simon is working`;
      return;
    }
  }

  el.textContent = "No working day found in next 60 days (unlikely)";
})();
</script>

</body>
    </html>
